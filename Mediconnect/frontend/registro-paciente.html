<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediConnect — Registro de paciente</title>
  <meta name="theme-color" content="#1565c0">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div class="pantalla-acceso">
    <div class="caja-acceso">
      <div class="logo-acceso">
        <h1>Crea tu cuenta</h1>
        <p>Tus datos generales ayudan a tu médico a conocerte mejor</p>
      </div>

      <div class="tarjeta">
        <div id="zona-aviso"></div>

        <form id="form-registro">
          <div class="campo">
            <label for="nombre">Nombre completo *</label>
            <input type="text" id="nombre" required>
          </div>
          <div class="campos-dobles">
            <div class="campo">
              <label for="cedula">Cédula *</label>
              <input type="text" id="cedula" required>
            </div>
            <div class="campo">
              <label for="telefono">Teléfono *</label>
              <input type="tel" id="telefono" required>
            </div>
          </div>
          <div class="campo">
            <label for="email">Correo (opcional)</label>
            <input type="email" id="email">
          </div>
          <div class="campo">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" required minlength="6">
          </div>

          <div class="campos-dobles">
            <div class="campo">
              <label for="edad">Edad *</label>
              <input type="number" id="edad" min="1" max="120" required>
            </div>
            <div class="campo">
              <label for="sexo">Sexo *</label>
              <select id="sexo" required>
                <option value="">Selecciona…</option>
                <option>Masculino</option>
                <option>Femenino</option>
              </select>
            </div>
          </div>

          <div class="campos-dobles">
            <div class="campo">
              <label for="tipo_sangre">Tipo de sangre *</label>
              <select id="tipo_sangre" required>
                <option value="">Selecciona…</option>
                <option>O+</option><option>O-</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
              </select>
            </div>
            <div class="campo">
              <label for="actividad_fisica">Actividad física *</label>
              <select id="actividad_fisica" required>
                <option value="">Selecciona…</option>
                <option>Sedentario</option>
                <option>Moderado</option>
                <option>Activo</option>
              </select>
            </div>
          </div>

          <div class="campos-dobles">
            <div class="campo">
              <label for="peso">Peso (kg) *</label>
              <input type="number" id="peso" step="0.1" min="1" required>
            </div>
            <div class="campo">
              <label for="altura">Altura (cm) *</label>
              <input type="number" id="altura" step="0.1" min="30" required>
            </div>
          </div>

          <div class="campos-dobles">
            <div class="campo">
              <label for="fumador">¿Fumas? *</label>
              <select id="fumador" required>
                <option value="">Selecciona…</option>
                <option>No</option>
                <option>Si</option>
              </select>
            </div>
            <div class="campo">
              <label for="alcohol">¿Consumes alcohol? *</label>
              <select id="alcohol" required>
                <option value="">Selecciona…</option>
                <option>No</option>
                <option>Ocasional</option>
                <option>Frecuente</option>
              </select>
            </div>
          </div>

          <p class="texto-suave" style="margin-bottom:12px">
            Las alergias y antecedentes familiares los podrás agregar después, desde tu perfil.
          </p>

          <button type="submit" class="boton boton-bloque" id="btn-registrar">Crear cuenta</button>
        </form>

        <p class="texto-suave texto-centrado mt-2">
          ¿Ya tienes cuenta? <a href="/index.html">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('form-registro').addEventListener('submit', async (evento) => {
      evento.preventDefault();
      const zonaAviso = document.getElementById('zona-aviso');
      limpiarAviso(zonaAviso);

      const btn = document.getElementById('btn-registrar');
      btn.disabled = true;

      const valor = (id) => document.getElementById(id).value.trim();

      try {
        await API.pedir('/auth/registro-paciente', {
          metodo: 'POST',
          cuerpo: {
            nombre: valor('nombre'),
            cedula: valor('cedula'),
            telefono: valor('telefono'),
            email: valor('email') || null,
            password: document.getElementById('password').value,
            edad: valor('edad'),
            sexo: valor('sexo'),
            tipo_sangre: valor('tipo_sangre'),
            actividad_fisica: valor('actividad_fisica'),
            peso: valor('peso'),
            altura: valor('altura'),
            fumador: valor('fumador'),
            alcohol: valor('alcohol')
          }
        });

        mostrarAviso(zonaAviso, 'exito', 'Cuenta creada. Ya puedes iniciar sesión con tu cédula.');
        setTimeout(() => { window.location.href = '/index.html'; }, 1600);
      } catch (error) {
        mostrarAviso(zonaAviso, 'error', error.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
